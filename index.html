<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>레트로 뉴스 타자 연습기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="main-container">
        <header class="stats-board">
            <div class="stat">타수: <span id="cpm">0</span></div>
            <div class="stat">정확도: <span id="accuracy">100</span>%</div>
            <div class="stat">오타: <span id="errors">0</span></div>
        </header>

        <section class="data-box">
            <textarea id="text-paste-area" placeholder="여기에 뉴스 기사나 장문의 글을 붙여넣으세요..."></textarea>
            <div class="btn-group">
                <button id="btn-load-paste">📋 붙여넣은 글 장착</button>
                <label for="file-input" class="file-label">📁 TXT 파일 선택</label>
                <input type="file" id="file-input" accept=".txt">
            </div>
        </section>

        <main class="practice-area">
            <div id="target-text" class="target-text">
                위의 입력창에 글을 붙여넣거나 TXT 파일을 불러와 연습을 시작하세요!
            </div>
            <input type="text" id="user-input" class="user-input" 
                   placeholder="문장이 장착되면 활성화됩니다" disabled
                   autocomplete="off" spellcheck="false" autocorrect="off">
        </main>

        <footer class="mode-info">
            <span id="current-mode">모드: 대기 중</span>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
