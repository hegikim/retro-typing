<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실시간 뉴스 타자 연습기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="stats-board">
            <div class="stat">타수: <span id="cpm">0</span></div>
            <div class="stat">정확도: <span id="accuracy">100</span>%</div>
            <div class="stat">오타: <span id="errors">0</span></div>
        </header>

        <main class="practice-area">
            <div id="target-text" class="target-text">
                구글 뉴스 가져오는 중... 잠시만 기다려주세요.
            </div>
            <input type="text" id="user-input" class="user-input" 
                   placeholder="뉴스가 로드되면 활성화됩니다" disabled
                   autocomplete="off" spellcheck="false" autocorrect="off">
        </main>

        <footer class="mode-info">
            <div id="current-mode">원격 연결 중...</div>
            <div id="news-source-area" style="margin-top: 8px; font-size: 0.9rem;">
                <a id="news-link" href="#" target="_blank" style="color: #ffcc00; text-decoration: underline; display: none;">
                    📰 Google News에서 기사 보기
                </a>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
